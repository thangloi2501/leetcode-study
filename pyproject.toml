[project]
name = "leetcode-study"
version = "0.1.0"
description = "Telegram bot that fetches a random LeetCode question by difficulty and sends a Gemini-summarized Vietnamese version."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]
